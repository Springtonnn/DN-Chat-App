<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แชทสาธารณะ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage no-anim" id="stage">

    <!-- Login screen -->
    <section class="screen screen-login" id="screen-login">
      <form class="login-card" id="form" autocomplete="off">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
        </span>
        <h1>แชทสาธารณะ</h1>
        <p class="sub">ใส่ชื่อผู้ใช้และรหัสผ่านเพื่อเข้าร่วม</p>

        <label for="username">ชื่อผู้ใช้</label>
        <input id="username" maxlength="20" required>
        <p class="hint" id="hint" aria-live="polite"></p>

        <label for="password" id="password-label">รหัสผ่าน</label>
        <input id="password" type="password" required>
        <p class="error" id="error" aria-live="polite"></p>

        <button class="btn" id="btn" type="submit">เข้าสู่ระบบ</button>
      </form>
    </section>

    <!-- Chat screen -->
    <section class="screen screen-chat" id="screen-chat">
      <aside class="sidebar">
        <div class="room-box">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
          </span>
          <span>แชทสาธารณะ</span>
        </div>
        <div class="divider"></div>
        <div class="member-list" id="member-list"></div>
        <div class="spacer"></div>
        <div class="me-box">
          <div class="me-top">
            <span class="avatar-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
            </span>
            <span class="me-name" id="me-name"></span>
            <span class="status-icon" aria-label="ออนไลน์"><span></span></span>
          </div>
          <button class="logout-pill" id="logout" type="button">ออกจากระบบ</button>
        </div>
      </aside>

      <div class="chat-panel">
        <div class="messages" id="messages"></div>
        <div class="toast" id="toast" aria-live="polite"></div>
        <div class="typing-indicator" id="typing-indicator" aria-live="polite"></div>
        <div class="composer">
          <button class="add-btn" id="add" type="button" aria-label="แนบไฟล์">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.avif,.txt,.csv,.zip,.doc,.docx,.xlsx,.pptx,application/pdf,image/png,image/jpeg,image/gif,image/webp,image/avif,text/plain,text/csv,application/zip,application/x-zip-compressed,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
          <input id="text" type="text" maxlength="2000" placeholder="พิมพ์ข้อความ..." autocomplete="off">
          <button class="send-btn" id="send" type="button" aria-label="ส่งข้อความ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          </button>
        </div>
      </div>
    </section>

  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
